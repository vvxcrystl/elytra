services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ELYTRA_TRUSTED_IP_HEADER: cf-connecting-ip
      ELYTRA_PUBLIC_ORIGIN: ${ELYTRA_PUBLIC_ORIGIN:?Set ELYTRA_PUBLIC_ORIGIN in .env to your full HTTPS URL}
      # Sign-in settings. Local accounts by default; official CrystlCloud instances set
      # ELYTRA_ACCOUNTS=oidc plus the client ID and secret in .env.
      ELYTRA_ACCOUNTS: ${ELYTRA_ACCOUNTS:-local}
      ELYTRA_OIDC_ISSUER: ${ELYTRA_OIDC_ISSUER:-}
      ELYTRA_OIDC_CLIENT_ID: ${ELYTRA_OIDC_CLIENT_ID:-}
      ELYTRA_OIDC_CLIENT_SECRET: ${ELYTRA_OIDC_CLIENT_SECRET:-}
      ELYTRA_OIDC_NAME: ${ELYTRA_OIDC_NAME:-}
      ELYTRA_PASSWORD_LOGIN: ${ELYTRA_PASSWORD_LOGIN:-true}
    volumes:
      - elytra-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy

volumes:
  elytra-data:
