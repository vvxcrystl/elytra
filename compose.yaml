services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ELYTRA_PUBLIC_ORIGIN: ${ELYTRA_PUBLIC_ORIGIN:?Set ELYTRA_PUBLIC_ORIGIN in .env to your full HTTPS URL}
    volumes:
      - elytra-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/openapi.json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy

volumes:
  elytra-data:
